[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = --timeout=10
filterwarnings =
    error::DeprecationWarning
    error::PendingDeprecationWarning
    ignore:.*BlockingPortal alias is deprecated.*:DeprecationWarning
markers =
    asyncio: marks tests that need an asyncio event loop


